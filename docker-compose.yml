services:
  postgres:
    image: postgres:16-alpine
    container_name: smartlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartlab
      POSTGRES_PASSWORD: smartlab_dev_password
      POSTGRES_DB: smartlab
    ports:
      - "5433:5432"
    volumes:
      - smartlab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartlab -d smartlab"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: labx-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - labx_qdrant_data:/qdrant/storage

  rag-api:
    build:
      context: ./rag-api
    container_name: labx-rag-api
    restart: unless-stopped
    environment:
      QDRANT_URL: http://qdrant:6333
      LLM_API_URL: ${GEMINI_API_URL:-https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
      LLM_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      INTERNAL_TOKEN: ${RAG_INTERNAL_TOKEN:-change-me}
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    volumes:
      - labx_hf_models:/models
    depends_on:
      - qdrant
    ports:
      - "8000:8000"

volumes:
  smartlab_pgdata:
  labx_qdrant_data:
  labx_hf_models:

